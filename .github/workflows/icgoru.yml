name: İçgörü verisi (ücretsiz kaynaklar — Nasdaq, Yahoo, Finnhub)
# Analist görüşleri, değerleme, bilanço geçmişi, temettü, 13F, içeriden işlemler, rakipler ve fon ağırlıkları.
# Bigdata.com kredisine bağlı değildir; Claude görevleri de gerektiğinde workflow_dispatch ile tetikler.
on:
  schedule:
    - cron: '11 23 * * 1-5'   # ABD kapanışından sonra (TR 02:11)
  pull_request:
    paths: ['tools/fetch_free.py', '.github/workflows/icgoru.yml']
  workflow_dispatch:
    inputs:
      parcalar:
        description: 'Boşlukla ayrılmış parçalar (analysts valuation earnhist dividends inst13f insider peers fundhold); boşsa hepsi'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('icgoru-pr-{0}', github.ref) || 'repo-yazma' }}
  cancel-in-progress: false
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Topla
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY || secrets.FINNHUB }}
        run: python3 -u tools/fetch_free.py ${{ github.event.inputs.parcalar }} ${{ github.event_name == 'pull_request' && '--dry' || '' }}
      - name: Yayınla
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "Portföy veri botu"
          git config user.email "portfoy-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "değişiklik yok"; exit 0; }
          git commit -m "İçgörü verisi (ücretsiz) $(TZ=Europe/Istanbul date '+%F %H:%M') TRT"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*7)); done
          exit 1
