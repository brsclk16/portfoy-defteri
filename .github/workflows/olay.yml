name: Olay sonrası tarihsel oranlar (SEC bilanço + Form 4)
on:
  schedule:
    - cron: '12 22 * * 1-5'   # TR 01:12 — kapanış fiyatlarından sonra; bilanço tepkisi varsa bağlamıyla Telegram
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: olay   # ayrı kuyruk; push döngüsü çakışmayı çözer
  cancel-in-progress: false
jobs:
  hesapla:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Hesapla
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python3 -u tools/build_events.py ${{ github.event_name == 'schedule' && '--notify' || '' }} --budget 1200
      - name: Yayınla
        run: |
          git config user.name "Portföy veri botu"
          git config user.email "portfoy-bot@users.noreply.github.com"
          git add data/events.json data/insider_hist.json data/_diag/events.json
          git diff --cached --quiet && { echo "değişiklik yok"; exit 0; }
          git commit -m "Olay oranları $(date -u +'%F')"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*7)); done
          exit 1
