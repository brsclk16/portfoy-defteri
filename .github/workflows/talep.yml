name: Site talepleri (bildirim + anında veri)
# Siteden ORION isteği (data/r/), soru (data/q/) ya da yeni sembol (data/watchlist.json) geldiğinde:
# Telegram'a "alındı" bildirimi gönderir; yeni sembolde ücretsiz verileri (fiyat, analist, değerleme, temettü, 13F, evren) hemen toplar.
# Sorular Gemini (Google Arama destekli) ile hemen cevaplanır → data/answers.json. Gemini başaramazsa akşamki Claude görevi cevaplar.
# ORION raporları ve enstrüman özetleri günde bir kez çalışan Claude görevlerinde yapılır.
on:
  push:
    branches: [main]
    paths: ['data/r/**', 'data/q/**', 'data/watchlist.json']
permissions:
  contents: write
concurrency:
  group: repo-yazma
  cancel-in-progress: false
jobs:
  talep:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Ne geldi?
        id: ne
        run: |
          git diff --name-only --diff-filter=A HEAD~1 HEAD -- data/r data/q > /tmp/yeni.txt || true
          W=0; git diff --quiet HEAD~1 HEAD -- data/watchlist.json || W=1
          echo "w=$W" >> $GITHUB_OUTPUT
          Q=0; ls data/q/*.json >/dev/null 2>&1 && Q=1
          echo "q=$Q" >> $GITHUB_OUTPUT
          python3 - <<'PY' > /tmp/msg.txt
          import json, os
          L = [l.strip() for l in open('/tmp/yeni.txt') if l.strip().endswith('.json')]
          out = []
          for f in L:
              try: d = json.load(open(f))
              except Exception: continue
              if f.startswith('data/r/'):
                  out.append(f"🔭 ORION isteği alındı: {d.get('mode','')} {' '.join(d.get('tickers') or [])} {d.get('topic') or ''}".strip())
              else:
                  out.append(f"💬 Soru alındı{(' (' + d['t'] + ')') if d.get('t') else ''}: {(d.get('q') or '')[:120]}")
          if any(f.startswith('data/r/') for f in L):
              out.append('ORION raporu bu akşam ~20:10 (TR) hazırlanacak.')
          if any(f.startswith('data/q/') for f in L):
              out.append('Soru birkaç dakika içinde cevaplanacak.')
          print('\n'.join(out))
          PY
          cat /tmp/msg.txt
      - name: Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          if [ -s /tmp/msg.txt ]; then python3 tools/tg.py "$(cat /tmp/msg.txt)"; fi
          if [ "${{ steps.ne.outputs.w }}" = "1" ]; then python3 tools/tg.py "➕ İzleme listesi değişti; ücretsiz veriler şimdi toplanıyor, enstrüman özeti bu akşam ~20:30 (TR) eklenecek."; fi
      - name: Soruları cevapla (Gemini)
        if: steps.ne.outputs.q == '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python3 -u tools/ai_tasks.py qa || true
      - name: Yeni sembollerin verisi
        if: steps.ne.outputs.w == '1'
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY || secrets.FINNHUB }}
          FMP_KEY: ${{ secrets.FMP_KEY || secrets.FINANCIALMODELINGPREP }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          SEC_UA: ${{ secrets.SEC_UA }}
        run: |
          NEW=$(python3 -c "
          import json
          w=[x.get('t') if isinstance(x,dict) else x for x in json.load(open('data/watchlist.json')).get('tickers',[])]
          u=json.load(open('data/universe.json')).get('data',{})
          print(' '.join(t for t in w if t and ':' not in t and t not in u))")
          echo "yeni: $NEW"
          if [ -n "$NEW" ]; then python3 -u tools/fetch_universe.py $NEW || true; fi
          python3 -u tools/fetch_free.py analysts valuation earnhist dividends inst13f insider peers fundhold || true
      - name: Yayınla
        if: steps.ne.outputs.w == '1' || steps.ne.outputs.q == '1'
        run: |
          git config user.name "Portföy veri botu"
          git config user.email "portfoy-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && { echo "değişiklik yok"; exit 0; }
          git commit -m "Site talepleri: cevap/veri $(TZ=Europe/Istanbul date '+%F %H:%M') TRT"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*7)); done
          exit 1
