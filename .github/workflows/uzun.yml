name: Uzun fiyat geçmişi (Yahoo, strateji doğrulama)
on:
  schedule:
    - cron: '23 23 * * 5'   # Cuma kapanıştan sonra, haftada bir
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-yazma
  cancel-in-progress: false
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 tools/fetch_long.py
      - name: Yayınla
        run: |
          git config user.name "Portföy veri botu"
          git config user.email "portfoy-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Uzun fiyat geçmişi $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*7)); done
          exit 1
