name: Fiyat güncellemesi (Yahoo Finance, FRED — Claude görevinin yerine)
on:
  schedule:
    - cron: '17,47 13-20 * * 1-5'   # ABD seansı boyunca 30 dakikada bir
    - cron: '27 21 * * 1-5'         # kapanıştan sonra (TR 00:27) + makro seriler
  pull_request:
    paths: ['tools/fetch_prices.py', 'tools/merge_quotes.py', '.github/workflows/fiyat.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('fiyat-pr-{0}', github.ref) || 'repo-yazma' }}
  cancel-in-progress: false
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fiyatlar
        run: python3 -u tools/fetch_prices.py ${{ (github.event.schedule == '27 21 * * 1-5' || github.event_name != 'schedule') && '--markets' || '' }} ${{ github.event_name == 'pull_request' && '--dry' || '' }}
      - name: Yayınla
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "Portföy veri botu"
          git config user.email "portfoy-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "değişiklik yok"; exit 0; }
          git commit -m "Fiyat güncellemesi $(TZ=Europe/Istanbul date '+%F %H:%M') TRT"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*7)); done
          exit 1
