name: Sinyal karnesi (canlı kayıt + puanlama)
on:
  schedule:
    - cron: '57 21 * * 1-5'   # TR 00:57 — kapanış fiyatları (fiyat.yml 21:27) yazıldıktan sonra
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Geriye dönük karneyi şimdi yeniden hesapla'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sinyal   # ayrı kuyruk: ortak kuyrukta bekleyen iş iptal edilebiliyor; push döngüsü çakışmayı çözer
  cancel-in-progress: false
jobs:
  karne:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Kaydet ve puanla
        run: node tools/signal_log.mjs ${{ inputs.backfill && '--backfill' || '' }}
      - name: Yayınla
        run: |
          git config user.name "Portföy veri botu"
          git config user.email "portfoy-bot@users.noreply.github.com"
          git add data/signals.json
          git diff --cached --quiet && { echo "değişiklik yok"; exit 0; }
          git commit -m "Sinyal karnesi $(date -u +'%F')"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*7)); done
          exit 1
