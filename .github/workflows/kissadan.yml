name: Kıssadan Hisse arşivi (WinningCircle sabah bülteni)
on:
  schedule:
    - cron: '47 5 * * *'    # TR 08:47 — bülten TR ~08:30'da yayınlanır, her gün (hafta sonu dahil)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kissadan  # ayrı kuyruk: ortak "repo-yazma" kuyruğunda bekleyen iş iptal ediliyordu; push döngüsü çakışmayı çözer
  cancel-in-progress: false
jobs:
  arsivle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Bülteni çek ve arşivle
        run: python3 -u tools/fetch_kissadan.py
      - name: Yayınla
        run: |
          git config user.name "Portföy veri botu"
          git config user.email "portfoy-bot@users.noreply.github.com"
          git add data/kissadan.json 2>/dev/null || true
          git diff --cached --quiet && { echo "değişiklik yok"; exit 0; }
          git commit -m "Kıssadan Hisse $(date -u +'%F %H:%M') UTC"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*7)); done
          exit 1
