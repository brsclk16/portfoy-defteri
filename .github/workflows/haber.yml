name: Haber toplayıcı (Kıssadan Hisse, RSS, Google News, TickerTick, SEC, GDELT, Finnhub, FMP)
on:
  schedule:
    - cron: '7 5 * * 1-5'    # TR 08:07 — sabah haber taramasından (08:52) önce
    - cron: '7 20 * * 1-5'   # TR 23:07 — akşam haber taramasından (23:52) önce
  push:
    branches: [main]
    paths: ['tools/fetch_news.py', 'tools/fetch_kissadan.py', '.github/workflows/haber.yml']
  pull_request:
    paths: ['tools/ai_news.py', '.github/workflows/haber.yml']
  workflow_dispatch:
permissions:
  contents: write
  models: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('haber-pr-{0}', github.ref) || 'repo-yazma' }}
  cancel-in-progress: false
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Topla
        if: github.event_name != 'pull_request'
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY || secrets.FINNHUB }}
          FMP_KEY: ${{ secrets.FMP_KEY || secrets.FINANCIALMODELINGPREP }}
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python3 -u tools/fetch_news.py
      - name: Haber özeti (anahtarsız kural + Google Çeviri; isteğe bağlı ücretsiz model)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python3 -u tools/ai_news.py ${{ github.event_name == 'pull_request' && '--dry' || '' }}
      - name: Yayınla
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "Portföy veri botu"
          git config user.email "portfoy-bot@users.noreply.github.com"
          git add data/news_raw.json data/_diag/news.json data/news_ai.json data/portfolio.json data/kissadan.json 2>/dev/null || git add data/news_raw.json data/_diag/news.json data/portfolio.json
          git diff --cached --quiet && { echo "değişiklik yok"; exit 0; }
          git commit -m "Ham haber $(date -u +'%F %H:%M') UTC"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*7)); done
          exit 1
