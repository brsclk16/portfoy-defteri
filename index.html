<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portföy Defteri</title>
<meta name="description" content="Kişisel portföy takibi: fiyatlar, pozisyonlar, fon içerikleri, haberler ve takvim.">
<meta name="theme-color" content="#07090d">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portföy">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307090d'/%3E%3Cpath d='M6 22l6-7 5 4 9-11' stroke='%23b8f25c' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<div id="bgfx" aria-hidden="true"></div>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#/ozet">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"/><path d="M6 22l6-7 5 4 9-11" stroke="var(--accent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Portföy<b>Defteri</b></span>
    </a>
    <nav class="tabs" id="tabs"></nav>
    <div class="top-r">
      <button class="icon" id="srch" title="Ara ( / )" aria-label="Ara"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="icon" id="sade" title="Sade / detaylı görünüm" aria-label="Görünüm"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 6h16M4 12h10M4 18h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <span class="pill" id="mkt"><i></i><span>—</span></span>
      <button class="seg" id="ccy" title="Para birimi"><span data-c="USD">$</span><span data-c="TRY">₺</span></button>
      <button class="icon" id="refresh" title="Canlı fiyatları yenile" aria-label="Yenile"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon" id="theme" title="Tema" aria-label="Tema"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
      <button class="user" id="user">Giriş</button>
    </div>
  </div>
  <div class="tape" id="tape"><div class="tape-in" id="tapeIn"></div></div>
</header>

<main id="view" class="wrap"><div class="loading"><div class="spin"></div>Veriler yükleniyor…</div></main>

<footer class="foot wrap">
  <div id="fresh">—</div>
  <div>Veri: Twelve Data, Alpha Vantage, Bigdata.com, fon sağlayıcıları. Yatırım tavsiyesi değildir.</div>
</footer>

<div class="modal" id="login" hidden>
  <div class="card login-card">
    <h3>Giriş yap</h3>
    <p class="muted">Pozisyonların ve ayarların bu hesaba bağlı, sadece sana özel saklanır.</p>
    <label>E-posta<input id="lEmail" type="email" autocomplete="username"></label>
    <label>Şifre<input id="lPass" type="password" autocomplete="current-password"></label>
    <div class="err" id="lErr" hidden></div>
    <div class="row-end"><button class="btn ghost" data-close>Vazgeç</button><button class="btn" id="lGo">Giriş</button></div>
  </div>
</div>

<div class="modal search" id="search" hidden><div class="card sbox"><input id="sq" placeholder="Enstrüman veya sayfa ara…" autocomplete="off"><div id="sres" class="sres"></div><div class="dim" style="font-size:11.5px;padding:8px 4px 0">↑↓ seç · Enter aç · Esc kapat · her yerden <b>/</b> ile açılır</div></div></div>
<nav class="bnav" id="bnav"></nav>
<div class="toast" id="toast" hidden></div>
<script src="analiz.js?v=10"></script>
<script src="ekler.js?v=10"></script>
<script src="teknik.js?v=10"></script>
<script src="strateji.js?v=10"></script>
<script src="duzen.js?v=10"></script>
<script src="arac.js?v=10"></script>
<script src="lab.js?v=10"></script>
<script src="ileri.js?v=10"></script>
<script src="kural.js?v=10"></script>
<script src="kontrol.js?v=10"></script>
<script src="app.js?v=11"></script>
</body>
</html>
